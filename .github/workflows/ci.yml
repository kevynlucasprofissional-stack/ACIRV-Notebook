name: Ingestion & Parity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests

      - name: "Guarantee 1: Check PR Immutability (Diff vs Base SHA)"
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Comparing PR diff between Base ($BASE_SHA) and Head ($HEAD_SHA)..."
          
          PR_ORIGINALS_DIFF=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 000-Arquivos-originais/)
          if [ -n "$PR_ORIGINALS_DIFF" ]; then
            echo "::error::PR VIOLATION: Pull Request contains changes to 000-Arquivos-originais/!"
            echo "$PR_ORIGINALS_DIFF"
            exit 1
          else
            echo "OK: PR does not touch 000-Arquivos-originais/."
          fi

      - name: Validate claims & referential integrity
        run: |
          python 98-Infraestrutura/ingestao/claims.py .

      - name: Validate vault invariants
        run: |
          python 98-Infraestrutura/ingestao/validar_invariantes.py .

      - name: Run test suite
        run: |
          cd 98-Infraestrutura/ingestao
          python -m pytest test_invariantes.py -v

      - name: "Guarantee 2: Check Runtime Immutability (Working Tree Status)"
        run: |
          RUNTIME_DIFF=$(git status --porcelain 000-Arquivos-originais/)
          if [ -n "$RUNTIME_DIFF" ]; then
            echo "::error::RUNTIME VIOLATION: Validation scripts modified 000-Arquivos-originais/ during execution!"
            echo "$RUNTIME_DIFF"
            exit 1
          else
            echo "OK: Runtime execution preserved 000-Arquivos-originais/ immutability."
          fi
